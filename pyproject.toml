[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-dataops-governance-engine"
version = "0.1.0"
description = "AI-Accelerated Analytics Engineering: static SQL/dbt AST auditor (sqlglot), automated Medallion scaffolder, ODCS v3.1 contract validator and Slim CI governance engine."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "dbt-core==1.9.2",
    "dbt-duckdb==1.9.2",
    "duckdb==2.0.0",
    "fastapi==0.162.2",
    "httpx==0.28.1",
    "pyarrow==26.0.1",
    "pydantic==2.14.3",
    "PyYAML==6.0.3",
    "sqlglot==30.33.0",
    "uvicorn==0.54.0",
]

[project.scripts]
dge = "dbt_dataops_governance.cli.main:main"
dge-mcp = "dbt_dataops_governance.mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: executes optional integration checks requiring external warehouse credentials",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
