version: 2

models:
  - name: dim_customers
    description: "Conformed customer dimension with LGPD-masked personal attributes and execution lineage metadata."
    config:
      contract:
        enforced: true
      meta:
        lgpd_tier: PSEUDONYMIZED_PII
    columns:
      - name: customer_id
        description: "Canonical natural customer identifier."
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: customer_sk
        description: "Strict SHA-256 customer surrogate primary key."
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: full_name_hash
        description: "Irreversible SHA-256 hash of customer full name."
        data_type: varchar
      - name: cpf_masked
        description: "Masked CPF string compliant with LGPD minimization."
        data_type: varchar
      - name: email_masked
        description: "Masked email address preserving domain only."
        data_type: varchar
      - name: phone_masked
        description: "Masked phone string preserving last four digits only."
        data_type: varchar
      - name: postal_code
        description: "Zero-padded 8-character canonical postal code."
        data_type: varchar
      - name: customer_segment
        description: "Normalized customer segment."
        data_type: varchar
        data_tests:
          - accepted_values:
              values: ["ENTERPRISE", "SMB", "UNCLASSIFIED"]
      - name: updated_at
        description: "UTC timestamp of last customer update."
        data_type: timestamp
      - name: _dge_invocation_id
        description: "dbt invocation UUID recorded by audit_run_metadata."
        data_type: varchar
      - name: _dge_loaded_at_utc
        description: "Execution UTC timestamp recorded by audit_run_metadata."
        data_type: timestamp
      - name: _dge_model_name
        description: "Target model relation name recorded by audit_run_metadata."
        data_type: varchar

  - name: fct_orders
    description: "Incremental orders fact table with watermark lookback filtering and enforced contract."
    config:
      contract:
        enforced: true
      meta:
        lgpd_tier: PUBLIC_NON_PERSONAL
    columns:
      - name: order_id
        description: "Canonical order identifier."
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: order_sk
        description: "Strict SHA-256 order surrogate key."
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to dim_customers.customer_id."
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: customer_sk
        description: "Foreign key to dim_customers.customer_sk."
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_sk
      - name: order_status
        description: "Normalized uppercase order status."
        data_type: varchar
        data_tests:
          - accepted_values:
              values: ["PAID", "PENDING", "CANCELLED"]
      - name: gross_amount_usd
        description: "Gross order value in USD."
        data_type: double
      - name: discount_usd
        description: "Discount applied in USD."
        data_type: double
      - name: net_amount_usd
        description: "Net order value after discount in USD."
        data_type: double
      - name: discount_rate
        description: "Safe discount-to-gross ratio."
        data_type: double
      - name: order_date
        description: "Calendar date when the order occurred."
        data_type: date
      - name: updated_at
        description: "UTC watermark timestamp for incremental merges."
        data_type: timestamp
      - name: _dge_invocation_id
        description: "dbt invocation UUID recorded by audit_run_metadata."
        data_type: varchar
      - name: _dge_loaded_at_utc
        description: "Execution UTC timestamp recorded by audit_run_metadata."
        data_type: timestamp
      - name: _dge_model_name
        description: "Target model relation name recorded by audit_run_metadata."
        data_type: varchar
